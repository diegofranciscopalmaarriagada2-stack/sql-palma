<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoGebra — Calculadora Álgebra</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Arial, sans-serif; background:#fff; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

/* HEADER */
.header { flex-shrink:0; width:100%; height:52px; overflow:hidden; }
.header img { width:100%; height:100%; object-fit:cover; object-position:top left; display:block; }

/* MAIN */
.main { display:flex; flex:1; overflow:hidden; }

/* SIDEBAR */
.sidebar { flex-shrink:0; width:72px; overflow:hidden; border-right:1px solid #e0e0e0; }
.sidebar img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }

/* CENTER */
.center { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.content-row { display:flex; flex:1; overflow:hidden; }

/* ALGEBRA PANEL */
.algebra-panel { width:260px; border-right:1px solid #e0e0e0; background:#fff; display:flex; flex-direction:column; flex-shrink:0; }
.algebra-toolbar { display:flex; align-items:center; padding:8px 10px; border-bottom:1px solid #eee; gap:6px; }
.add-btn { width:28px; height:28px; border-radius:50%; background:#fff; border:1.5px solid #bbb; font-size:18px; color:#666; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.add-btn:hover { background:#f5f5f5; }
.entrada-input { flex:1; border:none; outline:none; font-size:13px; color:#aaa; background:transparent; }

/* GRAPH AREA */
.graph-area { flex:1; position:relative; overflow:hidden; background:#fff; }
canvas { display:block; position:absolute; top:0; left:0; width:100%; height:100%; }
.graph-toolbar { position:absolute; top:10px; left:12px; display:flex; gap:6px; z-index:10; }
.graph-toolbar button { width:28px; height:28px; border:1px solid #ccc; border-radius:4px; background:#fff; cursor:pointer; font-size:14px; color:#555; display:flex; align-items:center; justify-content:center; }
.graph-toolbar button:hover { background:#f0f0f0; }
.graph-settings { position:absolute; top:10px; right:12px; z-index:10; width:28px; height:28px; border:1px solid #ccc; border-radius:4px; background:#fff; cursor:pointer; font-size:14px; color:#666; display:flex; align-items:center; justify-content:center; }
.graph-controls { position:absolute; right:12px; top:50px; display:flex; flex-direction:column; gap:4px; z-index:10; }
.graph-controls button { width:28px; height:28px; border:1px solid #ccc; border-radius:4px; background:#fff; cursor:pointer; color:#555; font-size:13px; display:flex; align-items:center; justify-content:center; }
.graph-controls button:hover { background:#f0f0f0; }

/* KEYBOARD */
.calc-keyboard { flex-shrink:0; width:100%; height:195px; border-top:1px solid #ddd; overflow:hidden; }
.calc-keyboard img { width:100%; height:100%; object-fit:cover; object-position:top left; display:block; }

/* ══════════════════════════════════════════════
   IA ÁLGEBRA — botón flotante + panel
══════════════════════════════════════════════ */
#ai-toggle {
  position:fixed; bottom:28px; right:12px;
  background:#6557d400; color:#fff;
  border:none; border-radius:22px;
  padding:8px 16px; font-size:13px; font-weight:700;
  cursor:pointer; z-index:300;
  box-shadow:0 2px 8px rgba(101, 87, 212, 0);
  letter-spacing:0.3px;
  transition:background 0.2s;
}
#ai-toggle:hover { background:#5647c400; }

#ai-panel {
  position:fixed; bottom:72px; right:12px;
  width:360px; height:500px;
  background:#fff; border:1.5px solid #e0e0e0;
  border-radius:12px; display:none; flex-direction:column;
  z-index:400; box-shadow:0 4px 24px rgba(0,0,0,0.13);
  font-family:Arial,sans-serif; font-size:13px;
  overflow:hidden;
}
#ai-panel.open { display:flex; }

#ai-header {
  background:#6557d400; color:#fff;
  padding:10px 14px; font-size:13px; font-weight:700;
  display:flex; justify-content:space-between; align-items:center;
  flex-shrink:0; border-radius:10px 10px 0 0;
}
#ai-header span { display:flex; align-items:center; gap:6px; }
#ai-close { background:none; border:none; cursor:pointer; color:#fff; font-size:16px; padding:0 2px; opacity:0.8; }
#ai-close:hover { opacity:1; }

/* Botones rápidos */
#quick-btns {
  display:flex; flex-wrap:wrap; gap:5px; padding:8px 10px;
  border-bottom:1px solid #eee; flex-shrink:0; background:#fafafa;
}
.qbtn {
  background:#ede9fb; color:#6557d4; border:1px solid #c5bef5;
  border-radius:14px; padding:4px 10px; font-size:11px; cursor:pointer;
  font-weight:600; transition:background 0.15s;
  white-space:nowrap;
}
.qbtn:hover { background:#d9d3f7; }

#ai-messages {
  flex:1; overflow-y:auto; padding:10px 12px;
  display:flex; flex-direction:column; gap:8px; background:#fff;
}
#ai-messages::-webkit-scrollbar { width:5px; }
#ai-messages::-webkit-scrollbar-thumb { background:#ddd; border-radius:3px; }

.ai-msg { font-size:12.5px; line-height:1.6; padding:8px 10px; border-radius:10px; max-width:92%; word-break:break-word; }
.ai-msg.user { background:#6557d4; color:#fff; align-self:flex-end; border-radius:10px 10px 2px 10px; }
.ai-msg.bot { background:#f3f0ff; color:#222; align-self:flex-start; border:1px solid #e2daf7; border-radius:10px 10px 10px 2px; }
.ai-msg.bot strong { color:#6557d4; }
.ai-msg.bot .formula { font-family:monospace; background:#eae6fb; border-radius:6px; padding:4px 8px; margin:4px 0; display:block; font-size:12px; color:#3a2d9e; }
.ai-msg.bot .resultado { font-size:14px; font-weight:700; color:#3a2d9e; background:#ddd8f7; padding:6px 10px; border-radius:8px; margin:6px 0; display:block; }

.ai-typing { font-size:11px; color:#999; padding:4px 8px; font-style:italic; align-self:flex-start; }

#ai-input-area { border-top:1px solid #eee; padding:8px 10px; display:flex; gap:6px; background:#fafafa; flex-shrink:0; }
#ai-input { flex:1; border:1.5px solid #d0c8f5; border-radius:8px; padding:7px 10px; font-family:Arial,sans-serif; font-size:12px; background:#fff; color:#333; outline:none; resize:none; min-height:36px; max-height:80px; }
#ai-input:focus { border-color:#6557d4; }
#ai-send { background:#6557d4; border:none; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; color:#fff; align-self:flex-end; }
#ai-send:hover { background:#5547c4; }
</style>
</head>

      <img id="img-keyboard" alt="Teclado Calculadora">

</div>

  <div id="ai-header">

    <button id="ai-close" onclick="toggleAI()">✕</button>
  </div><script>// Script para abrir la IA con Ctrl(derecha) + Shift(derecha) y cerrar con Esc
(function() {
    // Objeto para registrar el estado de las teclas presionadas
    let keysPressed = {};

    window.addEventListener('keydown', function(event) {
        // Registrar la tecla actual presionada utilizando event.code (detecta la ubicación exacta)
        keysPressed[event.code] = true;

        // Obtener los elementos del DOM de la IA
        const aiPanel = document.getElementById('ai-panel');

        // 1. LÓGICA PARA ABRIR: Ctrl Derecho + Shift Derecho
        if (keysPressed['ControlRight'] && keysPressed['ShiftRight']) {
            if (aiPanel && !aiPanel.classList.contains('open')) {
                // Si la función toggleAI existe en tu código, la usamos para mantener la consistencia
                if (typeof toggleAI === 'function') {
                    toggleAI();
                } else {
                    aiPanel.classList.add('open');
                }
            }
        }

        // 2. LÓGICA PARA CERRAR: Escape (Esc)
        if (event.code === 'Escape') {
            if (aiPanel && aiPanel.classList.contains('open')) {
                if (typeof toggleAI === 'function') {
                    toggleAI();
                } else {
                    aiPanel.classList.remove('open');
                }
                // Opcional: Quita el foco del input para que no se quede parpadeando al cerrar
                const aiInput = document.getElementById('ai-input');
                if (aiInput) aiInput.blur();
            }
        }
    });

    window.addEventListener('keyup', function(event) {
        // Limpiar el registro cuando se suelta una tecla
        delete keysPressed[event.code];
    });
})();</script>

const canvas = document.getElementById('graphCanvas');
const graphArea = document.getElementById('graphArea');
function drawGrid() {
  canvas.width  = graphArea.offsetWidth;
  canvas.height = graphArea.offsetHeight;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
  const cell = 58, ox = W*0.46, oy = H*0.36;
  ctx.strokeStyle='#e8e8e8'; ctx.lineWidth=0.5;
  for(let x=ox%cell;x<W;x+=cell){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=oy%cell;y<H;y+=cell){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='#aaa'; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();
  ctx.fillStyle='#999';
  ctx.beginPath();ctx.moveTo(W-2,oy);ctx.lineTo(W-9,oy-4);ctx.lineTo(W-9,oy+4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(ox,2);ctx.lineTo(ox-4,9);ctx.lineTo(ox+4,9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#777'; ctx.font='11px Arial';
  ctx.textAlign='center';
  for(let i=Math.floor(-ox/cell);i<=Math.floor((W-ox)/cell);i++){
    if(i===0)continue; ctx.fillText(i,ox+i*cell,oy+14);
  }
  ctx.textAlign='right';
  for(let i=Math.floor(-oy/cell);i<=Math.floor((H-oy)/cell);i++){
    if(i===0)continue; ctx.fillText(i,ox-5,oy-i*cell+4);
  }
  ctx.fillText('0',ox-5,oy+13);
}

const SYSTEM = `Eres un tutor de álgebra para un estudiante universitario chileno que se prepara para una prueba. 
Responde SIEMPRE en español simple, claro y paso a paso. Sé muy didáctico y usa ejemplos concretos.
Cuando el estudiante te dé números/datos, resuélvelos directamente mostrando cada paso.

TEMAS QUE DEBES DOMINAR:

1. SUCESIONES LINEALES (an = a1 + (n-1)·d):
   - Cómo detectar si es lineal: las diferencias entre términos son IGUALES
   - Fórmula general: an = a1 + (n-1)·d  →  simplificada: an = c + d·n
   - a1 = primer término, n = número del término, d = diferencia común
   - Ejemplo: 120, 150, 180, 210... → d=30, a1=120, an = 120 + (n-1)·30 = 90 + 30n
   - Cuando te den una tabla (n=0,1,2,3,4 con valores), calcula las diferencias

2. SUCESIONES CUADRÁTICAS (an = a·n² + b·n + c):
   - Cómo detectar: las diferencias de las diferencias son IGUALES (segunda diferencia constante)
   - Para encontrar a, b, c: usa el sistema de 3 ecuaciones con n=0,1,2
   - c = valor cuando n=0 (término inicial)
   - Primera diferencia: a0→a1, a1→a2, etc.
   - Segunda diferencia: diferencia de las primeras diferencias → 2a = segunda diferencia constante
   - Ejemplo sistema: an0=120, an1=126, an2=138 → c=120, a+b+c=126, 4a+2b+c=138

3. TÉRMINOS SEMEJANTES:
   - Son semejantes si tienen la MISMA variable Y el MISMO exponente
   - Ej: 3x² y 5x² son semejantes; 3x² y 3x NO son semejantes
   - Para reducir: suma/resta solo sus coeficientes
   - Ej: 3x + 5x = 8x; 7y² - 2y² = 5y²

4. MULTIPLICACIÓN ALGEBRAICA (monomio × monomio):
   - Multiplica coeficientes entre sí
   - Multiplica variables sumando exponentes
   - Ej: 3x² · 4x³ = 12x⁵; (-2y)·(5y²) = -10y³

5. PROPIEDAD DISTRIBUTIVA:
   A) Monomio × Binomio: a(b+c) = ab + ac
      Ej: 2x(x+3) = 2x² + 6x
   B) Monomio × Trinomio: a(b+c+d) = ab + ac + ad
      Ej: -3a(2a+5-1) = -6a² - 15a + 3a = -6a² - 12a
   C) Monomio × Polinomio: mismo principio, distribuye a cada término

6. BINOMIO × BINOMIO:
   (a+b)(c+d) = ac + ad + bc + bd  (método FOIL)
   Ej: (x+2)(x+3) = x²+3x+2x+6 = x²+5x+6
   Siempre simplifica los términos semejantes al final.

7. ÁREAS Y PERÍMETROS ALGEBRAICOS:
   - Área rectángulo = Largo × Ancho (multiplica los binomios)
   - Perímetro = 2·Largo + 2·Ancho = 2(L+A)
   - Para evaluar: sustituye x por el valor dado
   - Ej: L=4x+6, A=3x+5 → Área=(4x+6)(3x+5)=12x²+20x+18x+30=12x²+38x+30
   - Para x=12: 12(144)+38(12)+30 = 1728+456+30 = 2214

8. CLOSET/MUEBLES (área = largo × altura):
   - Si te dan el área total como polinomio y el largo, divide para encontrar la altura
   - Factoriza el polinomio del área o usa división de polinomios
   - Ej: Área=24x²+72x+48, Largo=6x+6 → divide: Altura=(24x²+72x+48)÷(6x+6)=4x+8

9. TAPACANTO:
   - Tapacanto = perímetro de una puerta
   - Para N puertas: N × perímetro
   - Para evaluar: sustituye x y calcula

FORMATO DE RESPUESTA:
- Usa ✅ para pasos correctos
- Muestra SIEMPRE la fórmula primero, luego sustituyes valores
- Si el estudiante da datos de una tabla, resuelve directamente
- Al final, escribe el RESULTADO en una línea destacada
- Sé breve pero completo. No más de 200 palabras por respuesta.
- Si no es de álgebra, dilo amablemente y redirige.`;

let aiMsgs = [];
let loading = false;

function toggleAI(){
  const p = document.getElementById('ai-panel');
  p.classList.toggle('open');
  if(p.classList.contains('open')) setTimeout(()=>document.getElementById('ai-input').focus(),50);
}

function quickAsk(txt){
  document.getElementById('ai-input').value = txt;
  aiSend();
}

function aiKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); aiSend(); }
}

function aiResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,80)+'px';
}

async function aiSend(){
  const inp = document.getElementById('ai-input');
  const txt = inp.value.trim();
  if(!txt || loading) return;
  inp.value=''; inp.style.height='auto';

  aiMsgs.push({role:'user', content:txt});
  appendMsg('user', txt);

  const typEl = document.createElement('div');
  typEl.className='ai-typing'; typEl.id='ai-typing'; typEl.textContent='Calculando...';
  document.getElementById('ai-messages').appendChild(typEl);
  scrollMsgs();
  loading = true;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._groqKey},
      body:JSON.stringify({
        model:'llama-3.1-8b-instant',
        messages:[{role:'system',content:SYSTEM},...aiMsgs.slice(-10)],
        max_tokens:700,
        temperature:0.2
      })
    });
    document.getElementById('ai-typing')?.remove();
    if(!res.ok){ const e=await res.json().catch(()=>{}); throw new Error(e?.error?.message||'Error '+res.status); }
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || 'Sin respuesta.';
    aiMsgs.push({role:'assistant',content:reply});
    appendMsg('bot', reply);
  } catch(e){
    document.getElementById('ai-typing')?.remove();
    appendMsg('bot','❌ Error: '+e.message);
  }
  loading=false;
}

function appendMsg(role, text){
  const div = document.createElement('div');
  div.className='ai-msg '+role;
  div.innerHTML = formatMsg(text);
  document.getElementById('ai-messages').appendChild(div);
  scrollMsgs();
}

function scrollMsgs(){
  const m=document.getElementById('ai-messages');
  m.scrollTop=m.scrollHeight;
}

function formatMsg(t){
  let h = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // bloques de código o fórmulas entre ```
  h = h.replace(/```([\s\S]*?)```/g, (_,c)=>`<span class="formula">${c.trim()}</span>`);
  // líneas con "Resultado" o "=" al final → destacar
  h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/\n/g,'<br>');
  return h;
}
